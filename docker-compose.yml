services:
  bililearn:
    build: .
    container_name: bililearn-ai
    ports:
      - "8000:8000"
    volumes:
      # 持久化 SQLite 数据库与导出文件
      - ./data:/app/backend/data
    environment:
      - BILI_DATABASE_URL=sqlite:////app/backend/data/bililearn.db
      - BILI_FRONTEND_DIST=/app/frontend-dist
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
